syntax = "proto2";
package raccoonai;

import "enums.proto";
import "file_upload.proto";
import "general.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "organization.proto";

option go_package = "./pb";

message Contract {
  required uint64 id = 1 [json_name = "id"];
  required google.protobuf.Timestamp created_at = 2 [json_name = "created_at"];
  required ContractType type = 3 [json_name = "type"];
  required string deal_number = 4 [json_name = "deal_number"];
  optional string name = 5 [json_name = "name"];
  required uint64 service_provider_id = 6 [json_name = "service_provider_id"];
  required uint64 target_organization_id = 7 [json_name = "target_organization_id"];
  required google.protobuf.Timestamp start_at = 8 [json_name = "start_at"];
  required google.protobuf.Timestamp end_at = 9 [json_name = "end_at"];
  optional google.protobuf.Timestamp signed_at = 10 [json_name = "signed_at"];
  optional google.protobuf.Timestamp paid_at = 11 [json_name = "paid_at"];
  optional string contract_file_key = 12 [json_name = "contract_file_key"];
  optional ContractStatus status = 13 [json_name = "status"];
  optional uint64 rent_cost = 15 [json_name = "rent_cost"];
  // Read only: job type → amount, derived from tariffs on every save. Kept for the
  // AI dispatcher (reads the column) and screens not yet moved to tariffs.
  optional google.protobuf.Struct tariff_rate_by_job_type = 16 [json_name = "tariff_rate_by_job_type"];
  optional Organization service_provider = 17 [json_name = "service_provider"];
  repeated FileUpload file_uploads = 18 [json_name = "file_uploads"];
  // Set where the caller preloads TargetOrganization. On a BY_NORM contract this
  // is the client paying monthly_fee.
  optional Organization target_organization = 19 [json_name = "target_organization"];
  // BY_NORM only: flat monthly charge. Not rent_cost, which is container rental.
  optional uint64 monthly_fee = 20 [json_name = "monthly_fee"];
  // One row per priced job type: the contract's prices.
  repeated ContractTariff tariffs = 21 [json_name = "tariffs"];
  // The RENT tariff card rent_cost was copied from; unset when typed in or no rent.
  optional uint64 rent_tariff_card_id = 22 [json_name = "rent_tariff_card_id"];
}

// A contract's price for one job type: a snapshot of a tariff card or a custom price.
message ContractTariff {
  required string job_type = 1 [json_name = "job_type"]; // a JobType name, as in tariff_rate_by_job_type
  // тенге per unit. Both required on a custom row; a card row takes the card's.
  optional uint64 amount = 2 [json_name = "amount"];
  optional BillingUnit unit = 3 [json_name = "unit"];
  optional uint64 tariff_card_id = 4 [json_name = "tariff_card_id"]; // unset = «Произвольный тариф»
}

// Wrapper so an update can tell "keep" (unset) from "clear" (set, no items).
message ContractTariffs {
  repeated ContractTariff items = 1 [json_name = "items"];
}

message ContractCreate {
  required string deal_number = 1 [json_name = "deal_number"];
  optional string name = 2 [json_name = "name"];
  optional ContractType type = 3 [json_name = "type"];
  required uint64 service_provider_id = 4 [json_name = "service_provider_id"];
  required uint64 target_organization_id = 5 [json_name = "target_organization_id"];
  required google.protobuf.Timestamp start_at = 6 [json_name = "start_at"];
  required google.protobuf.Timestamp end_at = 7 [json_name = "end_at"];
  optional google.protobuf.Timestamp signed_at = 8 [json_name = "signed_at"];
  optional google.protobuf.Timestamp paid_at = 9 [json_name = "paid_at"];
  optional string contract_file_key = 10 [json_name = "contract_file_key"]; // to be deprecated
  optional uint64 rent_cost = 12 [json_name = "rent_cost"];
  optional ContractStatus status = 13 [json_name = "status"];
  optional File file = 15 [json_name = "file"];
  optional uint64 monthly_fee = 16 [json_name = "monthly_fee"]; // BY_NORM only
  // When set, replaces the contract's tariffs (tariff_rate_by_job_type is derived).
  optional ContractTariffs tariffs = 17 [json_name = "tariffs"];
  // A RENT tariff card of the same provider; rent_cost is copied from it. 0 clears rent.
  optional uint64 rent_tariff_card_id = 18 [json_name = "rent_tariff_card_id"];
}

message ContractUpdate {
  required uint64 id = 1 [json_name = "id"];
  optional string deal_number = 2 [json_name = "deal_number"];
  optional string name = 3 [json_name = "name"];
  optional uint64 service_provider_id = 4 [json_name = "service_provider_id"]; // to be required
  optional uint64 target_organization_id = 5 [json_name = "target_organization_id"]; // to be required
  optional google.protobuf.Timestamp start_at = 6 [json_name = "start_at"];
  optional google.protobuf.Timestamp end_at = 7 [json_name = "end_at"];
  optional google.protobuf.Timestamp signed_at = 8 [json_name = "signed_at"];
  optional google.protobuf.Timestamp paid_at = 9 [json_name = "paid_at"];
  optional string contract_file_key = 10 [json_name = "contract_file_key"]; // to be deprecated
  optional ContractStatus status = 11 [json_name = "status"];
  optional uint64 rent_cost = 13 [json_name = "rent_cost"];
  optional File file = 15 [json_name = "file"];
  optional uint64 monthly_fee = 16 [json_name = "monthly_fee"]; // BY_NORM only
  // When set, replaces the contract's tariffs (tariff_rate_by_job_type is derived).
  optional ContractTariffs tariffs = 17 [json_name = "tariffs"];
  // A RENT tariff card of the same provider; rent_cost is copied from it. 0 clears rent.
  optional uint64 rent_tariff_card_id = 18 [json_name = "rent_tariff_card_id"];
}

message ContractList {
  repeated Contract contracts = 1 [json_name = "contracts"];
  optional ListInfo list_info = 2 [json_name = "list_info"];
}
