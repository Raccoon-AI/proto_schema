syntax = "proto2";
package raccoonai;

import "container_group.proto";
import "general.proto";
import "google/protobuf/timestamp.proto";
import "job.proto";

option go_package = "./pb";

// *****************************************************
// CONTAINER
// *****************************************************
enum ContainerStatus {
  CONTAINER_STATUS_UNDEFINED = 0;
  CONTAINER_STATUS_INACTIVE = 1;
  CONTAINER_STATUS_ACTIVE = 2;
}

enum ContainerTrackingEvent {
  CONTAINER_TRACKING_EVENT_UNDEFINED = 0;
  CONTAINER_TRACKING_EVENT_DELIVERED = 1;
  CONTAINER_TRACKING_EVENT_COLLECTED = 2;
}

message Container {
  required uint64 id = 1 [json_name = "id"];
  required string name = 2 [json_name = "name"];
  required uint64 type_id = 3 [json_name = "type_id"];
  required ContainerType type = 4 [json_name = "type"];
  required ContainerStatus status = 5 [json_name = "status"];
  required uint64 owner_organization_id = 6 [json_name = "owner_organization_id"];
  required bool is_tracked = 7 [json_name = "is_tracked"];
  optional uint64 pickup_location_id = 8 [json_name = "pickup_location_id"];
  optional ContainerTrackingEvent last_event = 9 [json_name = "last_event"];
  optional google.protobuf.Timestamp last_event_at = 10 [json_name = "last_event_at"];
  optional ContainerGroup container_group = 11 [json_name = "container_group"];
  // The job that last moved or serviced this container. Backend-written only.
  optional uint64 last_job_id = 12 [json_name = "last_job_id"];
  // last_job_id preloaded, on the reads that preload it.
  optional Job last_job = 13 [json_name = "last_job"];

  required google.protobuf.Timestamp created_at = 101 [json_name = "created_at"];
  required google.protobuf.Timestamp updated_at = 102 [json_name = "updated_at"];
}

message ContainerCreate {
  required string name = 1 [json_name = "name"];
  required uint64 type_id = 2 [json_name = "type_id"];
  required uint64 owner_organization_id = 3 [json_name = "owner_organization_id"];
  optional uint64 pickup_location_id = 4 [json_name = "pickup_location_id"];
  optional bool is_tracked = 5 [json_name = "is_tracked"];
  optional ContainerTrackingEvent last_event = 6 [json_name = "last_event"];
  optional google.protobuf.Timestamp last_event_at = 7 [json_name = "last_event_at"];
  optional uint64 container_group_id = 8 [json_name = "container_group_id"];
}

message ContainerUpdate {
  required uint64 id = 1 [json_name = "id"];
  optional uint64 owner_organization_id = 2 [json_name = "owner_organization_id"]; // to be required
  optional string name = 3 [json_name = "name"];
  optional uint64 type_id = 4 [json_name = "type_id"];
  optional ContainerStatus status = 5 [json_name = "status"];
  optional bool is_tracked = 6 [json_name = "is_tracked"];
  optional uint64 pickup_location_id = 7 [json_name = "pickup_location_id"];
  optional ContainerTrackingEvent last_event = 8 [json_name = "last_event"];
  optional google.protobuf.Timestamp last_event_at = 9 [json_name = "last_event_at"];
  optional uint64 container_group_id = 10 [json_name = "container_group_id"];
}

message ContainerStatusUpdate {
  required string name = 1 [json_name = "name"];
  required uint64 pickup_location_id = 2 [json_name = "pickup_location_id"];
  required ContainerTrackingEvent last_event = 3 [json_name = "last_event"];
  required uint64 owner_organization_id = 4 [json_name = "owner_organization_id"];
  // The job being executed when the container moved; must belong to
  // owner_organization_id. Omitted leaves the stored job in place.
  optional uint64 job_id = 5 [json_name = "job_id"];
}

message ContainerList {
  repeated Container containers = 1 [json_name = "containers"];
  optional ListInfo list_info = 2 [json_name = "list_info"];
}

message ContainerStatusCount {
  required ContainerStatus status = 1 [json_name = "status"];
  required uint64 count = 2 [json_name = "count"];
}

// One entry per status, including statuses with count 0. UNDEFINED appears only
// if some container carries an unrecognized status.
message ContainerStatusCountList {
  repeated ContainerStatusCount counts = 1 [json_name = "counts"];
  // Sum of counts.
  required uint64 total = 2 [json_name = "total"];
}
