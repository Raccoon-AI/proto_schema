syntax = "proto2";
package raccoonai;

import "general.proto";
import "google/protobuf/timestamp.proto";

option go_package = "./pb";

// VoximplantSettings carries everything the mobile softphone needs to register
// with Voximplant as the authenticated DaaS dispatcher.
message VoximplantSettings {
  required string account_name = 1 [json_name = "account_name"];
  required string application_name = 2 [json_name = "application_name"];
  // Fully qualified login: user@application.account.voximplant.com
  required string user_name = 3 [json_name = "user_name"];
  required string password = 4 [json_name = "password"];
  optional string display_name = 5 [json_name = "display_name"];
}

message CallLogRequest {
  optional ListFilter list_filter = 1 [json_name = "list_filter"];
  optional DateTimeFilter time_filter = 2 [json_name = "time_filter"];
  // Platform user ids of dispatchers. Empty = every user of the application.
  repeated uint64 user_ids = 3 [json_name = "user_ids"];
  // Only calls with this contact's phone number.
  optional uint64 contact_id = 4 [json_name = "contact_id"];
  // IN or OUT. Voximplant cannot filter on it, so it is applied to the
  // returned page; total_count stays unfiltered.
  optional string direction = 5 [json_name = "direction"];
}

message CallLogEntry {
  required string call_session_history_id = 1 [json_name = "call_session_history_id"];
  optional google.protobuf.Timestamp start_date = 2 [json_name = "start_date"];
  // Call duration in seconds.
  optional int32 duration = 3 [json_name = "duration"];
  optional string remote_number = 4 [json_name = "remote_number"];
  // IN for an incoming call, OUT for an outgoing one.
  optional string direction = 5 [json_name = "direction"];
  optional bool successful = 6 [json_name = "successful"];
  optional string record_url = 7 [json_name = "record_url"];
  // Platform user of the dispatcher on the call, when the Voximplant user is linked.
  optional uint64 user_id = 8 [json_name = "user_id"];
  optional string user_name = 9 [json_name = "user_name"];
  // Contact whose phone matches remote_number, when exactly one does.
  optional uint64 contact_id = 10 [json_name = "contact_id"];
  optional string contact_name = 11 [json_name = "contact_name"];
  optional string local_number = 12 [json_name = "local_number"];
  // Voximplant's finish reason, e.g. "Normal termination".
  optional string finish_reason = 13 [json_name = "finish_reason"];
}

message CallLogList {
  repeated CallLogEntry items = 1 [json_name = "items"];
  optional int64 total_count = 2 [json_name = "total_count"];
}
