syntax = "proto2";
package raccoonai;

import "container.proto";
import "container_group.proto";
import "enums.proto";
import "general.proto";

option go_package = "./pb";

message ContainerTypeRequest {
  required uint64 id = 1 [json_name = "id"];
  required uint64 owner_organization_id = 2 [json_name = "owner_organization_id"];
}

message ContainerTypeListRequest {
  repeated uint64 owner_organization_ids = 1 [json_name = "owner_organization_ids"];
  optional ListFilter list_filter = 2 [json_name = "list_filter"];
}

message ContainerGroupRequest {
  required uint64 id = 1 [json_name = "id"];
  required uint64 owner_organization_id = 2 [json_name = "owner_organization_id"];
}

message ContainerGroupListRequest {
  repeated uint64 owner_organization_ids = 1 [json_name = "owner_organization_ids"];
  repeated uint64 container_type_ids = 2 [json_name = "container_type_ids"];
  repeated uint64 pickup_location_ids = 3 [json_name = "pickup_location_ids"];
  optional ListFilter list_filter = 4 [json_name = "list_filter"];
  // Only container groups bound to these pickup location groups.
  repeated uint64 pickup_location_group_ids = 5 [json_name = "pickup_location_group_ids"];
  // Only container groups whose pickup location group binding carries this job
  // type (combined with pickup_location_group_ids: the same binding must satisfy both).
  optional JobType job_type = 6 [json_name = "job_type"];
  // Only container groups whose responsible zone holds one of these divisions.
  repeated uint64 division_ids = 7 [json_name = "division_ids"];
}

// The schedule is authorized through its container group's contract, so requests carry no organization.
message ContainerGroupScheduleCreate {
  required uint64 container_group_id = 1 [json_name = "container_group_id"];
  required JobType job_type = 2 [json_name = "job_type"];
  optional uint64 division_id = 3 [json_name = "division_id"];
  required string valid_from = 4 [json_name = "valid_from"]; // anchors every-N-days rules
  optional string valid_to = 5 [json_name = "valid_to"];
  reserved 6;
  reserved "schedule_type";
  required ScheduleRules rules = 7 [json_name = "rules"];
}

// The container group and the job type of a schedule do not change; create another schedule instead.
// A value and its clear_* flag together are rejected; every-N-days rules need a valid_from after the update.
message ContainerGroupScheduleUpdate {
  required uint64 id = 1 [json_name = "id"];
  optional uint64 division_id = 2 [json_name = "division_id"];
  optional string valid_from = 3 [json_name = "valid_from"];
  optional string valid_to = 4 [json_name = "valid_to"];
  reserved 5;
  reserved "schedule_type";
  optional ScheduleRules rules = 6 [json_name = "rules"];
  optional bool clear_valid_to = 7 [json_name = "clear_valid_to"]; // an unset field cannot say "open-ended"
  optional bool clear_division_id = 8 [json_name = "clear_division_id"]; // back to the zone's default
}

message ContainerGroupScheduleRequest {
  required uint64 id = 1 [json_name = "id"];
}

// At least one of container_group_ids or pickup_location_ids is required: they carry the authorization.
message ContainerGroupScheduleListRequest {
  repeated uint64 container_group_ids = 1 [json_name = "container_group_ids"];
  repeated uint64 pickup_location_ids = 2 [json_name = "pickup_location_ids"];
  optional JobType job_type = 3 [json_name = "job_type"];
  repeated uint64 division_ids = 4 [json_name = "division_ids"];
  optional string active_on = 5 [json_name = "active_on"]; // YYYY-MM-DD within the validity period
  optional ListFilter list_filter = 10 [json_name = "list_filter"];
}

// A schedule form as the user fills it: nothing is required yet.
message ScheduleDraft {
  optional uint64 container_group_id = 1 [json_name = "container_group_id"];
  optional JobType job_type = 2 [json_name = "job_type"];
  optional uint64 division_id = 3 [json_name = "division_id"];
  optional string valid_from = 4 [json_name = "valid_from"];
  optional string valid_to = 5 [json_name = "valid_to"];
  optional ScheduleRules rules = 6 [json_name = "rules"];
}

// Days a saved schedule, or a draft, puts a pickup on; the same evaluation the generator uses.
// Overlap is per day: a container group gets one job per job type and day, whatever the windows.
message PreviewScheduleRequest {
  oneof source {
    uint64 schedule_id = 1 [json_name = "schedule_id"];
    ScheduleDraft draft = 2 [json_name = "draft"];
  }
  optional uint64 exclude_schedule_id = 3 [json_name = "exclude_schedule_id"]; // the one being edited
  optional string from = 4 [json_name = "from"]; // default max(today, valid_from)
  optional string to = 5 [json_name = "to"]; // default min(valid_to, from + 90 days)
}

message ScheduleOccurrence {
  required string date = 1 [json_name = "date"];
  repeated ScheduleWindow windows = 2 [json_name = "windows"];
}

message ScheduleConflict {
  required string date = 1 [json_name = "date"];
  required uint64 schedule_id = 2 [json_name = "schedule_id"];
}

message PreviewScheduleResponse {
  repeated ScheduleOccurrence occurrences = 1 [json_name = "occurrences"];
  repeated ScheduleConflict conflicts = 2 [json_name = "conflicts"];
}

message CompatibleContainerGroupsRequest {
  required uint64 owner_organization_id = 1 [json_name = "owner_organization_id"];
  required uint64 truck_id = 2 [json_name = "truck_id"];
}

message ContainerRequest {
  required uint64 id = 1 [json_name = "id"];
  required uint64 owner_organization_id = 2 [json_name = "owner_organization_id"];
}

message ContainerListRequest {
  repeated uint64 owner_organization_ids = 1 [json_name = "owner_organization_ids"];
  repeated uint64 container_type_ids = 2 [json_name = "container_type_ids"];
  repeated uint64 pickup_location_ids = 3 [json_name = "pickup_location_ids"];
  repeated uint64 container_group_ids = 4 [json_name = "container_group_ids"];
  repeated ContainerStatus statuses = 5 [json_name = "statuses"];
  // facets: "status" (ContainerStatus), "last_event" (ContainerTrackingEvent).
  optional ListFilter list_filter = 6 [json_name = "list_filter"];
  // Free-text search, matched case-insensitively against the container name and
  // the name of its pickup location (its own, or the one its container group is
  // bound to). Combined with the other filters by AND.
  optional string search = 7 [json_name = "search"];
  // UNDEFINED also matches the containers no driver has ever reported.
  repeated ContainerTrackingEvent last_events = 8 [json_name = "last_events"];
  // Drivers who serviced the container last, resolved through its last job.
  repeated uint64 driver_ids = 9 [json_name = "driver_ids"];
}

service ContainerService {
  // Container Type operations
  rpc CreateContainerType(ContainerTypeCreate) returns (ContainerType) {}
  rpc GetContainerTypeById(ContainerTypeRequest) returns (ContainerType) {}
  rpc UpdateContainerType(ContainerTypeUpdate) returns (ContainerType) {}
  rpc ListContainerTypes(ContainerTypeListRequest) returns (ContainerTypeList) {}

  // Container Group operations
  rpc CreateContainerGroup(ContainerGroupCreate) returns (ContainerGroup) {}
  rpc GetContainerGroupById(ContainerGroupRequest) returns (ContainerGroup) {}
  rpc UpdateContainerGroup(ContainerGroupUpdate) returns (ContainerGroup) {}
  rpc ListContainerGroups(ContainerGroupListRequest) returns (ContainerGroupList) {}
  rpc DeleteContainerGroup(ContainerGroupRequest) returns (MessageResponse) {}
  rpc ListCompatibleContainerGroupsForTruck(CompatibleContainerGroupsRequest) returns (ContainerGroupList) {}

  // ContainerGroupSchedule
  rpc CreateContainerGroupSchedule(ContainerGroupScheduleCreate) returns (ContainerGroupSchedule) {}
  rpc UpdateContainerGroupSchedule(ContainerGroupScheduleUpdate) returns (ContainerGroupSchedule) {}
  rpc DeleteContainerGroupSchedule(ContainerGroupScheduleRequest) returns (MessageResponse) {}
  rpc ListContainerGroupSchedules(ContainerGroupScheduleListRequest) returns (ContainerGroupScheduleList) {}
  rpc PreviewSchedule(PreviewScheduleRequest) returns (PreviewScheduleResponse) {}

  // Container operations
  rpc CreateContainer(ContainerCreate) returns (Container) {}
  rpc GetContainerById(ContainerRequest) returns (Container) {}
  rpc UpdateContainer(ContainerUpdate) returns (Container) {}
  rpc ListContainers(ContainerListRequest) returns (ContainerList) {}
  rpc DeleteContainer(ContainerRequest) returns (MessageResponse) {}
  rpc UpdateContainerLocation(ContainerStatusUpdate) returns (MessageResponse) {}
}
