syntax = "proto2";
package raccoonai;

import "file_upload.proto";
import "general.proto";
import "google/protobuf/timestamp.proto";
import "gov_geo_access.proto";
import "organization.proto";

option go_package = "./pb";

// EcoInspectStatus tracks the lifecycle of an inspection as the city eco officer
// drives it from "just logged" through "provider must fix" to "resolved".
enum EcoInspectStatus {
  ECO_INSPECT_STATUS_UNDEFINED = 0;
  ECO_INSPECT_STATUS_CREATED = 1;
  ECO_INSPECT_STATUS_WAITING_FOR_RESPONSE = 2;
  ECO_INSPECT_STATUS_NEED_REVIEW = 3;
  ECO_INSPECT_STATUS_REVIEWED = 4;
}

// ---------------------------------------------------------------------------
// Reasons — a curated, growable pick-list (dynamic). Seeded with the ~10 known
// cases; the eco officer can add more via CreateEcoInspectReason ("Other").
// ---------------------------------------------------------------------------
message EcoInspectReason {
  required uint64 id = 1 [json_name = "id"];
  required string reason = 2 [json_name = "reason"];
}
message EcoInspectReasonCreate {
  required string reason = 1 [json_name = "reason"];
}
message EcoInspectReasonList {
  repeated EcoInspectReason reasons = 1 [json_name = "reasons"];
}

// ---------------------------------------------------------------------------
// Contacts — an eco-owned contact book keyed by service_provider_name (its own
// table + join to eco_inspect). Managed via the CRUD RPCs below; independent of
// the platform Contact/permify.
// ---------------------------------------------------------------------------
message EcoInspectContact {
  required uint64 id = 1 [json_name = "id"];
  optional string service_provider_name = 2 [json_name = "service_provider_name"];
  optional string contact_name = 3 [json_name = "contact_name"];
  optional string contact_phone = 4 [json_name = "contact_phone"];
  optional google.protobuf.Timestamp created_at = 101 [json_name = "created_at"];
  optional google.protobuf.Timestamp updated_at = 102 [json_name = "updated_at"];
}
message EcoInspectContactCreate {
  optional string service_provider_name = 1 [json_name = "service_provider_name"];
  optional string contact_name = 2 [json_name = "contact_name"];
  optional string contact_phone = 3 [json_name = "contact_phone"];
}
message EcoInspectContactUpdate {
  required uint64 id = 1 [json_name = "id"];
  optional string service_provider_name = 2 [json_name = "service_provider_name"];
  optional string contact_name = 3 [json_name = "contact_name"];
  optional string contact_phone = 4 [json_name = "contact_phone"];
}
message EcoInspectContactList {
  repeated EcoInspectContact contacts = 1 [json_name = "contacts"];
}
message EcoInspectContactRequest {
  // Restrict to a given service provider's contacts (the default-contacts picker).
  optional string service_provider_name = 1 [json_name = "service_provider_name"];
  // Typeahead: case-insensitive substring matched against contact name or phone.
  optional string query = 2 [json_name = "query"];
  // Max rows to return (default 50, capped at 100).
  optional uint32 limit = 3 [json_name = "limit"];
}

// Distinct service-provider names seen across inspections (GROUP BY), for the picker.
message EcoInspectServiceProviderList {
  repeated string service_provider_names = 1 [json_name = "service_provider_names"];
}

// ---------------------------------------------------------------------------
// Eco inspection
// ---------------------------------------------------------------------------
message EcoInspect {
  required uint64 id = 1 [json_name = "id"];
  required string uuid = 2 [json_name = "uuid"]; // uuid unique generated by us uuid per record

  optional string area_name = 3 [json_name = "area_name"];
  optional string service_provider_name = 4 [json_name = "service_provider_name"];

  optional string location = 5 [json_name = "location"];
  // Chosen reason, stored as a text snapshot (stable even if the reason list changes).
  optional string reason = 6 [json_name = "reason"];

  repeated FileUpload files = 7 [json_name = "files"];

  required EcoInspectStatus status = 8 [json_name = "status"];

  optional google.protobuf.Timestamp report_date = 9 [json_name = "report_date"];
  optional google.protobuf.Timestamp provider_report_uploaded_at = 10 [json_name = "provider_report_uploaded_at"];

  optional uint64 author_id = 11 [json_name = "author_id"];

  required google.protobuf.Timestamp created_at = 12 [json_name = "created_at"];
  required google.protobuf.Timestamp updated_at = 13 [json_name = "updated_at"];
  optional string comment = 14 [json_name = "comment"];

  // Contacts linked to this inspection (via the eco_inspect_contact_link join table).
  repeated EcoInspectContact contacts = 15 [json_name = "contacts"];

  optional string contact_name = 17 [json_name = "contact_name"];
  optional string contact_phone = 18 [json_name = "contact_phone"];
}

message EcoInspectList {
  repeated EcoInspect inspections = 1 [json_name = "inspections"];
  optional ListInfo list_info = 2 [json_name = "list_info"];
}

message EcoInspectCreate {
  optional string area_name = 1 [json_name = "area_name"];
  optional string service_provider_name = 2 [json_name = "service_provider_name"];
  optional string location = 3 [json_name = "location"];
  optional string reason = 4 [json_name = "reason"];
  repeated EcoInspectMediaUpload files = 5 [json_name = "files"];
  optional google.protobuf.Timestamp report_date = 6 [json_name = "report_date"];
  optional EcoInspectStatus status = 7 [json_name = "status"];
  optional string comment = 8 [json_name = "comment"];
  // Contacts to link (ids from the eco_inspect_contact table).
  repeated uint64 contact_ids = 9 [json_name = "contact_ids"];
}

message EcoInspectUpdate {
  required uint64 id = 1 [json_name = "id"];
  optional string area_name = 2 [json_name = "area_name"];
  optional string service_provider_name = 3 [json_name = "service_provider_name"];
  optional string location = 4 [json_name = "location"];
  optional string reason = 5 [json_name = "reason"];
  optional google.protobuf.Timestamp report_date = 6 [json_name = "report_date"];
  optional EcoInspectStatus status = 7 [json_name = "status"];
  optional string comment = 8 [json_name = "comment"];
  // When present, replaces the linked contacts with these ids.
  repeated uint64 contact_ids = 9 [json_name = "contact_ids"];
}

// EcoInspectMediaUpload appends media (images or videos) to a row.
message EcoInspectMediaUpload {
  optional uint64 id = 1 [json_name = "id"];
  required FileUploadType type = 2 [json_name = "type"];
  repeated File files = 3 [json_name = "files"];
}

message EcoInspectListRequest {
  optional string area_name = 1 [json_name = "area_name"];
  optional string service_provider_name = 2 [json_name = "service_provider_name"];
  optional EcoInspectStatus status = 3 [json_name = "status"];
  optional google.protobuf.Timestamp report_date_from = 4 [json_name = "report_date_from"];
  optional google.protobuf.Timestamp report_date_to = 5 [json_name = "report_date_to"];
  optional string location = 6 [json_name = "location"];
  // Exact match against the inspection's stored reason snapshot.
  optional string reason = 7 [json_name = "reason"];
  // Case-insensitive substring search across area, provider, location, reason,
  // comment and contact name/phone (both the row's snapshot and the provider's
  // contact book).
  optional string search = 8 [json_name = "search"];
  optional ListFilter list_filter = 10 [json_name = "list_filter"];
}

service EcoInspectService {
  // Pick-list helpers for the front end.
  rpc GetGovGeoAreaNames(EmptyMessageRequest) returns (GovGeoAccessList) {}
  rpc GetGovServiceProviders(EmptyMessageRequest) returns (OrganizationList) {}
  rpc ListServiceProviderNames(EmptyMessageRequest) returns (EcoInspectServiceProviderList) {}

  // Reasons (dynamic pick-list).
  rpc ListEcoInspectReasons(EmptyMessageRequest) returns (EcoInspectReasonList) {}
  rpc CreateEcoInspectReason(EcoInspectReasonCreate) returns (EcoInspectReason) {}
  rpc DeleteEcoInspectReason(IdRequest) returns (MessageResponse) {}

  // Contacts (eco-owned contact book; default contacts per service provider).
  rpc ListEcoInspectContacts(EcoInspectContactRequest) returns (EcoInspectContactList) {}
  rpc CreateEcoInspectContact(EcoInspectContactCreate) returns (EcoInspectContact) {}
  rpc UpdateEcoInspectContact(EcoInspectContactUpdate) returns (EcoInspectContact) {}
  rpc DeleteEcoInspectContact(IdRequest) returns (MessageResponse) {}

  // Eco inspection.
  rpc CreateEcoInspect(EcoInspectCreate) returns (EcoInspect) {}
  rpc UpdateEcoInspect(EcoInspectUpdate) returns (EcoInspect) {}
  rpc GetEcoInspect(IdRequest) returns (EcoInspect) {}
  rpc ListEcoInspects(EcoInspectListRequest) returns (EcoInspectList) {}
  rpc DeleteEcoInspect(IdRequest) returns (MessageResponse) {}
  rpc UploadEcoInspectMedia(EcoInspectMediaUpload) returns (EcoInspect) {}
}
