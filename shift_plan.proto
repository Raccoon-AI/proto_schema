syntax = "proto2";
package raccoonai;

import "google/protobuf/timestamp.proto";

option go_package = "./pb";

// ShiftPlan is planning intent only: "driver X should work on date D".
// It never references a truck — vehicles are assigned later, when the actual
// driver_on_shift record is created. There is no stored status either: the
// schedule cell state (planned / missed / worked) is derived at read time by
// ShiftPlanService.ListShiftSchedule from this table and driver_on_shift.
message ShiftPlan {
  required uint64 id = 1 [json_name = "id"];
  required uint64 owner_organization_id = 2 [json_name = "owner_organization_id"];
  required uint64 driver_id = 3 [json_name = "driver_id"];
  // Calendar date, "YYYY-MM-DD", in the platform business timezone (Asia/Almaty).
  required string plan_date = 4 [json_name = "plan_date"];
  optional google.protobuf.Timestamp created_at = 101 [json_name = "created_at"];
  optional google.protobuf.Timestamp updated_at = 102 [json_name = "updated_at"];
}

message ShiftPlanCreate {
  required uint64 owner_organization_id = 1 [json_name = "owner_organization_id"];
  required uint64 driver_id = 2 [json_name = "driver_id"];
  // "YYYY-MM-DD"; must be strictly after today in Asia/Almaty.
  required string plan_date = 3 [json_name = "plan_date"];
}
