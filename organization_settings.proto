syntax = "proto2";
package raccoonai;

import "audit_logs.proto";
import "enums.proto";
import "google/protobuf/timestamp.proto";

option go_package = "./pb";

message NotificationConfig {
  // rules: replaced by NotificationSettingsService. The admin settings page still sends it.
  reserved 2;
  reserved "rules";
  // Audit-log view filter.
  repeated AuditLogType log_types = 1 [json_name = "log_types"];
}

message ColumnConfig {
  required string column_name = 1 [json_name = "column_name"];
  required bool is_hidden = 2 [json_name = "is_hidden"];
  required uint32 order = 3 [json_name = "order"];
  optional uint32 width = 4 [json_name = "width"];
}

message TableConfig {
  required string table_name = 1 [json_name = "table_name"];
  repeated ColumnConfig columns = 2 [json_name = "columns"];
}

message TableColumnsConfig {
  repeated TableConfig tables = 1 [json_name = "tables"];
}

// Wrapped in a message so an empty selection stays present on update: a bare
// repeated field marshals to nothing and the merge would keep the old selection.
message DisposalSiteOrgIds {
  repeated uint64 ids = 1 [json_name = "ids"];
}

// Job types the service provider does not offer. Absent or empty = all enabled.
// Read via GetSetting, written via OrganizationService.UpdateDisabledJobTypes.
message DisabledJobTypes {
  repeated JobType types = 1 [json_name = "types"];
}

// organization_id picks another organization's settings, e.g. the company an admin works in;
// absent = the caller's own.
message OrganizationSettingsRequest {
  optional uint64 organization_id = 1 [json_name = "organization_id"];
}

// DisabledJobTypes for one organization: absent organization_id = the caller's own.
message DisabledJobTypesUpdate {
  repeated JobType types = 1 [json_name = "types"];
  optional uint64 organization_id = 2 [json_name = "organization_id"];
}

// Platform features an admin turns on per organization.
enum FeatureFlag {
  FEATURE_FLAG_UNDEFINED = 0;
  FEATURE_FLAG_JOB_MAP = 1; // «Карта заданий» on the jobs page
}

// Wrapped so an empty list stays present on update: absent = keep, empty = all off.
message FeatureFlags {
  repeated FeatureFlag flags = 1 [json_name = "flags"];
}

message OrganizationSettings {
  required uint64 id = 1 [json_name = "id"];
  optional string shift_departure_text = 3 [json_name = "shift_departure_text"];
  optional string shift_arrival_text = 4 [json_name = "shift_arrival_text"];
  optional string shift_working_schedule = 5 [json_name = "shift_working_schedule"];
  required google.protobuf.Timestamp created_at = 6 [json_name = "created_at"];
  required bool is_ai_driven = 7 [json_name = "is_ai_driven"];
  optional NotificationConfig notification_config = 8 [json_name = "notification_config"];
  optional double map_center_lat = 9 [json_name = "map_center_lat"];
  optional double map_center_lon = 10 [json_name = "map_center_lon"];
  optional bool ai_enabled = 11 [json_name = "ai_enabled"];
  optional TableColumnsConfig table_columns_config = 12 [json_name = "table_columns_config"];
  optional double reward_coeff = 13 [json_name = "reward_coeff"];
  optional uint64 default_depot_id = 15 [json_name = "default_depot_id"];
  optional DisposalSiteOrgIds disposal_site_org_ids = 16 [json_name = "disposal_site_org_ids"];
  optional DisabledJobTypes disabled_job_types = 17 [json_name = "disabled_job_types"];
  optional bool responsible_zone_enabled = 18 [json_name = "responsible_zone_enabled"]; // responsible zones apply to the organization and its subtree
  optional FeatureFlags feature_flags = 19 [json_name = "feature_flags"];
}

message OrganizationSettingsCreate {
  required uint64 id = 1 [json_name = "id"];
  optional string shift_departure_text = 2 [json_name = "shift_departure_text"];
  optional string shift_arrival_text = 3 [json_name = "shift_arrival_text"];
  optional string shift_working_schedule = 4 [json_name = "shift_working_schedule"];
  optional bool is_ai_driven = 5 [json_name = "is_ai_driven"];
  optional NotificationConfig notification_config = 6 [json_name = "notification_config"];
  optional double map_center_lat = 7 [json_name = "map_center_lat"];
  optional double map_center_lon = 8 [json_name = "map_center_lon"];
  optional bool ai_enabled = 9 [json_name = "ai_enabled"];
  optional TableColumnsConfig table_columns_config = 10 [json_name = "table_columns_config"];
  optional uint64 default_depot_id = 12 [json_name = "default_depot_id"];
  optional DisposalSiteOrgIds disposal_site_org_ids = 13 [json_name = "disposal_site_org_ids"];
  optional bool responsible_zone_enabled = 15 [json_name = "responsible_zone_enabled"]; // admin only
}

message OrganizationSettingsUpdate {
  required uint64 id = 1 [json_name = "id"];
  optional string shift_departure_text = 2 [json_name = "shift_departure_text"];
  optional string shift_arrival_text = 3 [json_name = "shift_arrival_text"];
  optional string shift_working_schedule = 4 [json_name = "shift_working_schedule"];
  optional bool is_ai_driven = 5 [json_name = "is_ai_driven"];
  optional NotificationConfig notification_config = 6 [json_name = "notification_config"];
  optional double map_center_lat = 7 [json_name = "map_center_lat"];
  optional double map_center_lon = 8 [json_name = "map_center_lon"];
  optional bool ai_enabled = 9 [json_name = "ai_enabled"];
  optional TableColumnsConfig table_columns_config = 10 [json_name = "table_columns_config"];
  optional uint64 default_depot_id = 12 [json_name = "default_depot_id"];
  optional DisposalSiteOrgIds disposal_site_org_ids = 13 [json_name = "disposal_site_org_ids"];
  optional bool responsible_zone_enabled = 15 [json_name = "responsible_zone_enabled"]; // admin only
  optional FeatureFlags feature_flags = 16 [json_name = "feature_flags"]; // admin only
}
