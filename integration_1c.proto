syntax = "proto2";
package raccoonai;

import "enums.proto";
import "general.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "./pb";

// Export contract for a service provider's 1C accounting extension. Flat
// messages, independent of Job / Organization / Contract, so those can change
// without breaking 1C. Every list is scoped server-side to the token user's
// owner organization and its descendants; requests carry no organization id.
//
// Pages: list_filter.current_page / page_size only; rows are always sorted by
// id ascending so pages stay stable while new rows appear. A missing
// list_filter reads as page 0 of the default size.

// Half-open range: from <= value < to, both UTC. At most 366 days.
message Integration1CPeriod {
  required google.protobuf.Timestamp from = 1 [json_name = "from"];
  required google.protobuf.Timestamp to = 2 [json_name = "to"];
}

message Integration1CCounterpartyRef {
  required uint64 id = 1 [json_name = "id"];
  required string name = 2 [json_name = "name"];
  optional string bin = 3 [json_name = "bin"];
}

message Integration1CContractRef {
  required uint64 id = 1 [json_name = "id"];
  required string deal_number = 2 [json_name = "deal_number"];
}

message Integration1CPickupLocationRef {
  required uint64 id = 1 [json_name = "id"];
  optional string name = 2 [json_name = "name"];
  optional string address = 3 [json_name = "address"];
}

message Integration1CContainer {
  optional string type_name = 1 [json_name = "type_name"];
  // m³
  optional float volume = 2 [json_name = "volume"];
}

// One service fact. Only COMPLETED and FORCE_COMPLETED are billable;
// CANCELLED appears only when asked for (include_cancelled).
message Integration1CJob {
  required uint64 id = 1 [json_name = "id"];
  required JobStatus status = 2 [json_name = "status"];
  required JobType type = 3 [json_name = "type"];
  required JobCategory category = 4 [json_name = "category"];
  optional google.protobuf.Timestamp fact_end_at = 5 [json_name = "fact_end_at"];
  // Tenge, fixed when the job was done. Absent: job without a tariff.
  optional uint64 job_tariff = 6 [json_name = "job_tariff"];
  optional string order_number = 7 [json_name = "order_number"];
  required Integration1CCounterpartyRef counterparty = 8 [json_name = "counterparty"];
  // The container group's contract. Absent when the group has none.
  optional Integration1CContractRef contract = 9 [json_name = "contract"];
  optional Integration1CPickupLocationRef pickup_location = 10 [json_name = "pickup_location"];
  optional Integration1CContainer container = 11 [json_name = "container"];
  optional double fact_total_volume = 12 [json_name = "fact_total_volume"];
  optional double num_of_container = 13 [json_name = "num_of_container"];
  optional double weight_kg = 14 [json_name = "weight_kg"];
  optional string driver_full_name = 15 [json_name = "driver_full_name"];
  optional string truck_plate_number = 16 [json_name = "truck_plate_number"];
  required google.protobuf.Timestamp created_at = 17 [json_name = "created_at"];
  // Changes after a job was billed are detected through this field.
  required google.protobuf.Timestamp updated_at = 18 [json_name = "updated_at"];
  // 20-29: billing state reported back by 1C (act, invoice, payment).
  reserved 20 to 29;
}

message Integration1CJobListRequest {
  // Range on fact_end_at. Required.
  required Integration1CPeriod period = 1 [json_name = "period"];
  repeated uint64 counterparty_ids = 2 [json_name = "counterparty_ids"];
  // Re-read specific jobs; still within period and scope.
  repeated uint64 job_ids = 3 [json_name = "job_ids"];
  // Only jobs with updated_at >= this moment.
  optional google.protobuf.Timestamp updated_since = 4 [json_name = "updated_since"];
  optional bool include_cancelled = 5 [json_name = "include_cancelled"];
  optional ListFilter list_filter = 10 [json_name = "list_filter"];
}

message Integration1CJobRequest {
  required uint64 id = 1 [json_name = "id"];
}

message Integration1CJobList {
  repeated Integration1CJob items = 1 [json_name = "items"];
  optional ListInfo list_info = 2 [json_name = "list_info"];
}

// A counterparty of the provider: an organization it holds a contract with.
message Integration1CCounterparty {
  required uint64 id = 1 [json_name = "id"];
  required string name = 2 [json_name = "name"];
  // Matching key for the 1C counterparty. May be empty.
  optional string bin = 3 [json_name = "bin"];
  optional string jur_address = 4 [json_name = "jur_address"];
  optional string fact_address = 5 [json_name = "fact_address"];
  optional string director_full_name = 6 [json_name = "director_full_name"];
  optional string contact_name = 7 [json_name = "contact_name"];
  optional string contact_phone = 8 [json_name = "contact_phone"];
  optional string contact_email = 9 [json_name = "contact_email"];
  // Strongest effective status among the contracts with this counterparty.
  required ContractStatus contract_status = 10 [json_name = "contract_status"];
  required google.protobuf.Timestamp updated_at = 11 [json_name = "updated_at"];
  // 20-29: the 1C reference once linked.
  reserved 20 to 29;
}

message Integration1CCounterpartyListRequest {
  optional ContractStatus contract_status = 1 [json_name = "contract_status"];
  // Name substring, or BIN prefix when digits only.
  optional string search = 2 [json_name = "search"];
  optional ListFilter list_filter = 10 [json_name = "list_filter"];
}

message Integration1CCounterpartyList {
  repeated Integration1CCounterparty items = 1 [json_name = "items"];
  optional ListInfo list_info = 2 [json_name = "list_info"];
}

// A contract where the provider is the service provider.
message Integration1CContract {
  required uint64 id = 1 [json_name = "id"];
  required string deal_number = 2 [json_name = "deal_number"];
  optional string name = 3 [json_name = "name"];
  required ContractType type = 4 [json_name = "type"];
  required ContractStatus status = 5 [json_name = "status"];
  required uint64 counterparty_id = 6 [json_name = "counterparty_id"];
  required google.protobuf.Timestamp start_at = 7 [json_name = "start_at"];
  required google.protobuf.Timestamp end_at = 8 [json_name = "end_at"];
  optional google.protobuf.Timestamp signed_at = 9 [json_name = "signed_at"];
  // Job type name -> tenge per job. Reference only; the job's own job_tariff
  // is the billed amount.
  optional google.protobuf.Struct tariff_rate_by_job_type = 10 [json_name = "tariff_rate_by_job_type"];
  // CONTRACT_TYPE_BY_NORM only: flat monthly charge, tenge.
  optional uint64 monthly_fee = 11 [json_name = "monthly_fee"];
  // Container rental, tenge.
  optional uint64 rent_cost = 12 [json_name = "rent_cost"];
  required google.protobuf.Timestamp updated_at = 13 [json_name = "updated_at"];
  // 20-29: the 1C reference once linked.
  reserved 20 to 29;
}

message Integration1CContractListRequest {
  repeated uint64 counterparty_ids = 1 [json_name = "counterparty_ids"];
  optional ContractStatus status = 2 [json_name = "status"];
  optional ListFilter list_filter = 10 [json_name = "list_filter"];
}

message Integration1CContractList {
  repeated Integration1CContract items = 1 [json_name = "items"];
  optional ListInfo list_info = 2 [json_name = "list_info"];
}
