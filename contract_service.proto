syntax = "proto2";
package raccoonai;

import "contract.proto";
import "file_upload.proto";
import "general.proto";
import "tariff_card.proto";

option go_package = "./pb";

// Contract Requests - either service provider or target organization can request contract details
message ContractListRequest {
  repeated uint64 service_provider_ids = 1 [json_name = "service_provider_ids"];
  repeated uint64 target_organization_ids = 2 [json_name = "target_organization_ids"];
  optional string status = 3 [json_name = "status"];
  optional string type = 4 [json_name = "type"];
  optional uint64 pickup_location_id = 5 [json_name = "pickup_location_id"];
  optional uint64 container_group_id = 6 [json_name = "container_group_id"];
  // Also the contracts of the providers' ancestors, so a child organization sees its parent's contracts.
  optional bool include_ancestors = 7 [json_name = "include_ancestors"];
  optional ListFilter list_filter = 10 [json_name = "list_filter"];
}

message ContractRequest {
  required uint64 id = 1 [json_name = "id"];
  required uint64 service_provider_id = 2 [json_name = "service_provider_id"];
  required uint64 target_organization_id = 3 [json_name = "target_organization_id"];
}

message UploadContractFilesRequest {
  required uint64 contract_id = 1 [json_name = "contract_id"];
  repeated File files = 2 [json_name = "files"];
}

message DeleteContractFilesRequest {
  required uint64 contract_id = 1 [json_name = "contract_id"];
  repeated uint64 file_ids = 2 [json_name = "file_ids"];
}

service ContractService {
  rpc CreateContract(ContractCreate) returns (Contract);
  rpc GetContract(ContractRequest) returns (Contract);
  rpc UpdateContract(ContractUpdate) returns (Contract);
  rpc ListContracts(ContractListRequest) returns (ContractList);
  rpc ArchiveContract(ContractRequest) returns (Contract);
  rpc DeleteContractFiles(DeleteContractFilesRequest) returns (MessageResponse);
  rpc UploadContractFiles(UploadContractFilesRequest) returns (Contract);

  // Names a service provider's contracts are picked from, kept like customer
  // types: the contract stores the name itself. Archive / restore with Update(status);
  // Delete removes a template for good, and its name can be added again.
  rpc CreateContractNameTemplate(OrganizationLabelCreate) returns (OrganizationLabel);
  rpc UpdateContractNameTemplate(OrganizationLabelUpdate) returns (OrganizationLabel);
  rpc ListContractNameTemplates(OrganizationLabelListRequest) returns (OrganizationLabelList);
  rpc DeleteContractNameTemplate(OrganizationLabelRequest) returns (MessageResponse);

  // Reusable prices a provider's contracts are filled from. Archive / restore
  // with Update(status); contracts keep the price they copied.
  rpc CreateTariffCard(TariffCardCreate) returns (TariffCard);
  rpc UpdateTariffCard(TariffCardUpdate) returns (TariffCard);
  rpc ListTariffCards(TariffCardListRequest) returns (TariffCardList);
}
