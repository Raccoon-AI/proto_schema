  ERROR_CODE_NOSQL_DATABASE_ISSUE = 906;
  ERROR_CODE_VRP_SERVICE_ISSUE = 907;
  ERROR_CODE_COST_PROVIDER_ISSUE = 908;

  // Business rules. One code per rule, numbered in blocks of one hundred per
  // entity: 1000 route, 1100 job, 1200 driver_on_shift, 1300 truck,
  // 1400 contract, 1500 pickup_location, 1600 organization, 1700 user/driver,
  // 1800 shift_plan, 1900 contact, 2000 driver_price_list,
  // 2100 resource_access_grant. 9000+ is client-side only.
  // Append-only: never rename an entry, never reuse a number.

  // route
  ERROR_CODE_ROUTE_FINAL = 1001;
  ERROR_CODE_ROUTE_NOT_RETURNING = 1002;
  ERROR_CODE_ROUTE_INVALID_TRANSITION = 1003;
  ERROR_CODE_ROUTE_NO_DRIVER_ON_SHIFT = 1004;
  ERROR_CODE_ROUTE_NOT_APPROVABLE = 1005;
  ERROR_CODE_ROUTE_NOT_APPROVED = 1006;
  ERROR_CODE_ROUTE_DRIVER_ON_SHIFT_CHANGE_NOT_ALLOWED = 1007;
  ERROR_CODE_ROUTE_NO_DESTINATION = 1008;
  ERROR_CODE_ROUTE_NOT_DISSOLVABLE = 1009;
  ERROR_CODE_ROUTE_SAME_SOURCE_DESTINATION = 1010;
  ERROR_CODE_ROUTE_ANOTHER_IN_PROGRESS = 1011;
  ERROR_CODE_ROUTE_NO_JOB_ON_SERVICE = 1012;
