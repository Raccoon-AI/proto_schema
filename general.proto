  ERROR_CODE_JOB_ALREADY_ON_SERVICE = 1102;
  ERROR_CODE_JOB_NOT_ON_SERVICE = 1103;
  ERROR_CODE_JOB_FINAL = 1104;
  ERROR_CODE_JOB_NOT_DETACHABLE = 1105;
  ERROR_CODE_JOB_INVALID_TRANSITION = 1106;
  ERROR_CODE_JOB_NOT_ENROUTE = 1107;
  ERROR_CODE_JOB_NO_DRIVER_ON_SHIFT = 1108;
  ERROR_CODE_JOB_NOT_COMPLETED = 1109;
  ERROR_CODE_JOB_INSTRUCTIONS_NOT_EDITABLE = 1110;
  ERROR_CODE_JOB_LIST_CONFLICT = 1111;
  ERROR_CODE_JOB_NOT_LISTED = 1112;
  ERROR_CODE_JOB_CATEGORY_NO_ROUTE_CATEGORY = 1113;
  ERROR_CODE_JOB_ROUTE_CATEGORY_MISMATCH = 1114;
  ERROR_CODE_JOB_HAS_NO_ROUTE = 1115;
  ERROR_CODE_JOB_ALREADY_ASSIGNED = 1116;

  // driver_on_shift
  ERROR_CODE_DRIVER_ON_SHIFT_NOT_APPROVABLE = 1201;
  ERROR_CODE_DRIVER_ON_SHIFT_NO_DRIVER = 1202;
  ERROR_CODE_DRIVER_ON_SHIFT_TRUCK_BUSY = 1203;
  ERROR_CODE_DRIVER_ON_SHIFT_DRIVER_BUSY = 1204;
  ERROR_CODE_DRIVER_ON_SHIFT_DRIVER_CONFLICT = 1205;
  ERROR_CODE_DRIVER_ON_SHIFT_INVALID_TRANSITION = 1206;
  ERROR_CODE_DRIVER_ON_SHIFT_ROUTE_UNFINISHED = 1207;
  ERROR_CODE_DRIVER_ON_SHIFT_NOT_ASSIGNABLE = 1208;
  ERROR_CODE_DRIVER_ON_SHIFT_NO_TRUCK = 1209;
  ERROR_CODE_DRIVER_ON_SHIFT_START_NOT_FUTURE = 1210;
  ERROR_CODE_DRIVER_ON_SHIFT_TOO_SHORT = 1211;

  // truck
  ERROR_CODE_TRUCK_JOB_LIMIT = 1301;
  ERROR_CODE_TRUCK_JOB_INCOMPATIBLE = 1302;
  ERROR_CODE_TRUCK_NO_DEPOT = 1303;
  ERROR_CODE_TRUCK_NO_TYPE = 1304;
  ERROR_CODE_TRUCK_ENGINE_TYPE_ALREADY_SET = 1305;
  ERROR_CODE_TRUCK_ENGINE_TYPE_NOT_SET = 1306;

  // contract / container_group
  ERROR_CODE_CONTAINER_GROUP_NOT_BOUND = 1401;
  ERROR_CODE_CONTRACT_PARTIES_MISMATCH = 1402;
  ERROR_CODE_CONTAINER_GROUP_NO_SCHEDULE = 1403;
  ERROR_CODE_CONTAINER_GROUP_SCHEDULE_NOT_COVERING_DAY = 1404;

  // pickup_location / pickup_location_group
  ERROR_CODE_PICKUP_LOCATION_NOT_IN_ROUTE = 1501;
  ERROR_CODE_PICKUP_LOCATION_NO_JOB_LEFT = 1502;
  ERROR_CODE_PICKUP_LOCATION_ALREADY_SERVED = 1503;
  ERROR_CODE_PICKUP_LOCATION_TOO_FAR = 1504;
  ERROR_CODE_PICKUP_LOCATION_GROUP_NO_DEFAULT_TRUCK = 1505;
  ERROR_CODE_PICKUP_LOCATION_GROUP_NO_CONTAINER_GROUPS = 1506;

  // organization
  ERROR_CODE_ORGANIZATION_MISMATCH = 1601;
  ERROR_CODE_ORGANIZATION_NOT_SERVICE_PROVIDER = 1602;
  ERROR_CODE_ORGANIZATION_NOT_SERVICE_RECEIVER = 1603;
  ERROR_CODE_ORGANIZATION_NO_PRICING_SETTINGS = 1604;
  ERROR_CODE_ORGANIZATION_NO_HOURLY_RATE = 1605;
  ERROR_CODE_ORGANIZATION_NO_NIGHT_MULTIPLIER = 1606;
  ERROR_CODE_ORGANIZATION_NO_ACTIVE_DEPOT = 1607;
  ERROR_CODE_ORGANIZATION_MULTIPLE_ACTIVE_DEPOTS = 1608;

  // user / driver
  ERROR_CODE_DRIVER_NOT_IN_ORGANIZATION = 1701;

  // shift_plan
  ERROR_CODE_SHIFT_PLAN_DATE_NOT_FUTURE = 1801;
  ERROR_CODE_SHIFT_PLAN_USER_NOT_DRIVER = 1802;

  // contact
  ERROR_CODE_CONTACT_NO_PHONE_NUMBER = 1901;

  // driver_price_list
  ERROR_CODE_DRIVER_PRICE_LIST_MONTH_CLOSED = 2001;
  ERROR_CODE_DRIVER_PRICE_LIST_APPEND_ONLY = 2002;
  ERROR_CODE_DRIVER_PRICE_LIST_ALREADY_PRICED = 2003;
  ERROR_CODE_DRIVER_PRICE_LIST_PRICE_OUT_OF_RANGE = 2004;

  // resource_access_grant
  ERROR_CODE_RESOURCE_ACCESS_GRANT_ROLE_NOT_APPLICABLE = 2101;

  // Client-side conditions. The backend never sends these; they live here so a
  // client has one registry of every error it can show. Expect them in the
  // go-backend reachability report as permanently unreachable.
  ERROR_CODE_COMPANY_NOT_SELECTED = 9001;
}

enum ResponseStatus {
  RESPONSE_STATUS_UNDEFINED = 0;
  RESPONSE_STATUS_OK = 1;
  RESPONSE_STATUS_NOT_FOUND = 2;
  RESPONSE_STATUS_SERVER_ERROR = 3;
}

message ErrorMessage {
  optional ErrorCode code = 1 [json_name = "code"]; // To show clients what exactly went wrong, useful for client-side handling
  repeated string messages = 2 [json_name = "messages"]; // For developers
  // Values for the message template a client renders for `code`, e.g.
  // {"id": "15574", "status": "DRIVER_ON_SHIFT_STATUS_IDLE"}. Enum values are
  // sent as their full proto name so the client can localize them too; ids are
  // decimal, timestamps RFC 3339.
  map<string, string> args = 3 [json_name = "args"];
}

message MessageResponse {
  required ResponseStatus status = 1 [json_name = "status"];
  optional string message = 2 [json_name = "message"];
  optional ErrorMessage error = 3 [json_name = "error"];
}

message EmptyMessageRequest {}

message EmptyMessageResponse {}

message IdRequest {
  required uint64 id = 1 [json_name = "id"];
}

enum SortDirection {
  SORT_DIRECTION_UNDEFINED = 0;
  SORT_DIRECTION_ASCENDING = 1;
  SORT_DIRECTION_DESCENDING = 2;
}

message ListFilter {
  optional uint32 current_page = 1 [
    json_name = "current_page",
    default = 0
  ]; // starting from 0 (OFFSET)
  optional uint32 page_size = 2 [
    json_name = "page_size",
    default = 50
  ]; // max 100 (LIMIT)
  optional string sort_by = 3 [
    json_name = "sort_by",
    default = "id"
  ]; // field name to sort by, default is "id"
  optional SortDirection sort_direction = 4 [
    json_name = "sort_direction",
    default = SORT_DIRECTION_DESCENDING
  ];
}

message ListInfo {
  required uint32 total_items = 1 [json_name = "total_items"];
  required uint32 current_page = 2 [json_name = "current_page"]; // <-- ListFilter.current_page
  required uint32 page_size = 3 [json_name = "page_size"]; // <-- ListFilter.page_size
  optional string sort_by = 4 [
    json_name = "sort_by",
    default = "id"
  ];
  optional SortDirection sort_direction = 5 [
    json_name = "sort_direction",
    default = SORT_DIRECTION_DESCENDING
  ];
}
