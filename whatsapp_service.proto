syntax = "proto2";
package raccoonai;

import "enums.proto";
import "general.proto";
import "whatsapp.proto";

option go_package = "./pb";

// The order dialogues the client wrote in, newest first by default.
message ListWhatsappDialoguesRequest {
  // Required, with descendants: a dialogue's order provider, else its contact's organization.
  repeated uint64 service_provider_ids = 1 [json_name = "service_provider_ids"];
  optional DateTimeFilter time_filter = 2 [json_name = "time_filter"]; // on created_at
  repeated uint64 author_ids = 3 [json_name = "author_ids"];
  repeated WhatsappDialogueStatus statuses = 4 [json_name = "statuses"];
  optional string search = 5 [json_name = "search"]; // phone, person or customer
  repeated CallCenterTag tags = 6 [json_name = "tags"]; // any of
  repeated uint64 customer_ids = 7 [json_name = "customer_ids"]; // the contact's organization
  optional bool has_job = 8 [json_name = "has_job"]; // unset: both
  // sort_by: created_at, job_id, customer, contact, phone, author, status.
  optional ListFilter list_filter = 10 [json_name = "list_filter"];
}

// A dispatcher's tags and note on a dialogue: both replace what is stored.
message UpdateWhatsappDialogueRequest {
  required uint64 id = 1 [json_name = "id"];
  repeated CallCenterTag tags = 2 [json_name = "tags"];
  optional string note = 3 [json_name = "note"];
}

message WhatsappMessagesRequest {
  optional uint64 job_id = 1 [json_name = "job_id"];
  optional uint64 contact_id = 2 [json_name = "contact_id"];
  optional uint64 dialogue_id = 3 [json_name = "dialogue_id"];
}

// A dispatcher's free-text message to the client of a job's WhatsApp dialogue.
message SendWhatsappMessageRequest {
  // The order's newest dialogue; ignored when dialogue_id is set.
  optional uint64 job_id = 1 [json_name = "job_id"];
  required string body = 2 [json_name = "body"];
  // Generated by the sender per message; a repeat returns the first send's message.
  required string client_message_id = 3 [json_name = "client_message_id"];
  optional uint64 dialogue_id = 4 [json_name = "dialogue_id"];
}

service WhatsappService {
  rpc ListWhatsappMessages(WhatsappMessagesRequest) returns (WhatsappMessageList) {}
  // Sends inside WhatsApp's 24-hour window only; puts the dialogue in operator
  // mode, so the client's replies reach the dispatcher instead of the bot.
  rpc SendWhatsappMessage(SendWhatsappMessageRequest) returns (WhatsappMessage) {}
  rpc ListWhatsappDialogues(ListWhatsappDialoguesRequest) returns (WhatsappDialogueList) {}
  rpc UpdateWhatsappDialogue(UpdateWhatsappDialogueRequest) returns (WhatsappDialogue) {}
}
