syntax = "proto2";
package raccoonai;

import "driver_incident.proto";

option go_package = "./pb";

service DriverIncidentService {
  rpc ListDriverIncidents(DriverIncidentListRequest) returns (DriverIncidentList) {}
  // A dispatcher records why a job was not carried out; the job's newest incident is its reason.
  rpc CreateJobIncident(JobIncidentCreateRequest) returns (DriverIncident) {}
}
