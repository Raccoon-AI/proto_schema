syntax = "proto2";
package raccoonai;

import "device.proto";
import "general.proto";

option go_package = "./pb";

// Admin side of company tablets. Authorized by the user resource: whoever
// manages an organization's employees manages its tablets.
service DeviceService {
  // The organization's enrollment code for the QR; created on first call.
  rpc GetEnrollmentCode(DeviceEnrollmentCodeRequest) returns (DeviceEnrollmentCode) {}
  // Replaces the enrollment code: the old QR stops enrolling new tablets.
  // Tablets already enrolled keep working.
  rpc ResetEnrollmentCode(DeviceEnrollmentCodeRequest) returns (DeviceEnrollmentCode) {}
  rpc ListDevices(DeviceListRequest) returns (DeviceList) {}
  // Revokes the device and closes every session opened from it.
  rpc RevokeDevice(IdRequest) returns (Device) {}
}
