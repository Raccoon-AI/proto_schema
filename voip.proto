syntax = "proto2";
package raccoonai;

import "general.proto";
import "google/protobuf/timestamp.proto";

option go_package = "./pb";

// Lifecycle of a tenant's Voximplant child account.
enum VoipTenantStatus {
  VOIP_TENANT_STATUS_UNDEFINED = 0;
  VOIP_TENANT_STATUS_PROVISIONING = 1;
  VOIP_TENANT_STATUS_ACTIVE = 2;
  VOIP_TENANT_STATUS_SUSPENDED = 3;
  VOIP_TENANT_STATUS_OFFBOARDED = 4;
}

// VoipTenant is one organization's Voximplant child account. Credentials and
// secrets never leave the backend.
message VoipTenant {
  required uint64 id = 1 [json_name = "id"];
  required uint64 organization_id = 2 [json_name = "organization_id"];
  // Immutable tenant name: raccoon-dispatch, client-<slug>.
  required string slug = 3 [json_name = "slug"];
  optional uint64 vox_account_id = 4 [json_name = "vox_account_id"];
  optional string vox_account_name = 5 [json_name = "vox_account_name"];
  required string vox_app_name = 6 [json_name = "vox_app_name"];
  required VoipTenantStatus status = 7 [json_name = "status"];
  // Last provisioning step that completed; "done" once active.
  optional string provision_step = 8 [json_name = "provision_step"];
  // Error of the last failed step, cleared on the next successful run.
  optional string last_error = 9 [json_name = "last_error"];
  required uint32 seat_limit = 10 [json_name = "seat_limit"];
  optional double balance = 11 [json_name = "balance"];
  optional string balance_currency = 12 [json_name = "balance_currency"];
  optional google.protobuf.Timestamp balance_checked_at = 13 [json_name = "balance_checked_at"];
  optional double low_balance_threshold = 14 [json_name = "low_balance_threshold"];
  required bool outbound_suspended = 15 [json_name = "outbound_suspended"];
  // JSON passed to scenarios through tenant_config: queues, working hours,
  // concurrent-call cap.
  optional string config = 16 [json_name = "config"];
  optional google.protobuf.Timestamp created_at = 101 [json_name = "created_at"];
  optional google.protobuf.Timestamp updated_at = 102 [json_name = "updated_at"];
}

message VoipTenantOnboardRequest {
  required uint64 organization_id = 1 [json_name = "organization_id"];
  required string slug = 2 [json_name = "slug"];
  // Defaults to "comms".
  optional string vox_app_name = 3 [json_name = "vox_app_name"];
  // The child account created for this tenant. Required on the first call
  // while child account creation is not automated.
  optional uint64 vox_account_id = 4 [json_name = "vox_account_id"];
  // A service-account key of the child account, used once to mint the
  // Provisioner's own key and then discarded. Required on the first call.
  optional string bootstrap_credentials_json = 5 [json_name = "bootstrap_credentials_json"];
  optional uint32 seat_limit = 6 [json_name = "seat_limit"];
  optional double low_balance_threshold = 7 [json_name = "low_balance_threshold"];
  optional string config = 8 [json_name = "config"];
}

message VoipTenantListRequest {
  optional VoipTenantStatus status = 1 [json_name = "status"];
  optional ListFilter list_filter = 2 [json_name = "list_filter"];
}

message VoipTenantList {
  repeated VoipTenant items = 1 [json_name = "items"];
  optional int64 total_count = 2 [json_name = "total_count"];
}

// VoipOperator is a platform user linked to a Voximplant user of the
// tenant application. One seat each.
message VoipOperator {
  required uint64 id = 1 [json_name = "id"];
  required uint64 user_id = 2 [json_name = "user_id"];
  optional string user_name = 3 [json_name = "user_name"];
  required uint64 voip_tenant_id = 4 [json_name = "voip_tenant_id"];
  // Fully qualified Voximplant login: op-<user_id>@<app>.<account>.voximplant.com
  required string login = 5 [json_name = "login"];
  optional string display_name = 6 [json_name = "display_name"];
  // agent, supervisor or admin; copied into the Voximplant user's custom data.
  required string role = 7 [json_name = "role"];
  required bool active = 8 [json_name = "active"];
  optional google.protobuf.Timestamp created_at = 101 [json_name = "created_at"];
}

message VoipOperatorLinkRequest {
  required uint64 user_id = 1 [json_name = "user_id"];
  // Defaults to agent.
  optional string role = 2 [json_name = "role"];
}

message VoipOperatorListRequest {
  // Admins may name any organization; owners see their own.
  optional uint64 organization_id = 1 [json_name = "organization_id"];
}

message VoipOperatorList {
  repeated VoipOperator items = 1 [json_name = "items"];
  required uint32 seat_limit = 2 [json_name = "seat_limit"];
  required uint32 seats_used = 3 [json_name = "seats_used"];
}

message VoipLoginHashRequest {
  // The key the Web SDK received from requestOneTimeLoginKey.
  required string one_time_key = 1 [json_name = "one_time_key"];
}

// VoipLoginHash is what the Web SDK passes to loginWithOneTimeKey.
message VoipLoginHash {
  required string login = 1 [json_name = "login"];
  required string hash = 2 [json_name = "hash"];
  required string account_name = 3 [json_name = "account_name"];
  required string application_name = 4 [json_name = "application_name"];
}

// VoipNumber is a SIP number bought by hand and bound to the tenant
// application through a SIP registration. SIP credentials never leave the
// backend.
message VoipNumber {
  required uint64 id = 1 [json_name = "id"];
  required uint64 voip_tenant_id = 2 [json_name = "voip_tenant_id"];
  // E.164 without spaces, e.g. +77011234567.
  required string number = 3 [json_name = "number"];
  required string sip_username = 4 [json_name = "sip_username"];
  required string sip_proxy = 5 [json_name = "sip_proxy"];
  optional uint64 sip_registration_id = 6 [json_name = "sip_registration_id"];
  // pending (not registered yet), bound, unbound.
  required string status = 7 [json_name = "status"];
  optional string last_error = 8 [json_name = "last_error"];
  optional google.protobuf.Timestamp created_at = 101 [json_name = "created_at"];
}

message VoipNumberAddRequest {
  required uint64 voip_tenant_id = 1 [json_name = "voip_tenant_id"];
  required string number = 2 [json_name = "number"];
  required string sip_username = 3 [json_name = "sip_username"];
  required string sip_proxy = 4 [json_name = "sip_proxy"];
  // Defaults to sip_username.
  optional string sip_auth_user = 5 [json_name = "sip_auth_user"];
  required string sip_password = 6 [json_name = "sip_password"];
}

message VoipNumberListRequest {
  required uint64 voip_tenant_id = 1 [json_name = "voip_tenant_id"];
}

message VoipNumberList {
  repeated VoipNumber items = 1 [json_name = "items"];
}

// VoipUsage is one tenant's calls and talk time in one calendar month,
// from the mirrored call log. Invoices are produced from it outside.
message VoipUsage {
  required uint64 voip_tenant_id = 1 [json_name = "voip_tenant_id"];
  required string slug = 2 [json_name = "slug"];
  // YYYY-MM, UTC.
  required string month = 3 [json_name = "month"];
  required uint64 calls_in = 4 [json_name = "calls_in"];
  required uint64 calls_out = 5 [json_name = "calls_out"];
  required uint64 seconds_in = 6 [json_name = "seconds_in"];
  required uint64 seconds_out = 7 [json_name = "seconds_out"];
}

message VoipUsageRequest {
  // Admins may name a tenant; owners get their own organization's.
  optional uint64 voip_tenant_id = 1 [json_name = "voip_tenant_id"];
  // Half-open window on call start; defaults to the current month.
  optional google.protobuf.Timestamp from = 2 [json_name = "from"];
  optional google.protobuf.Timestamp to = 3 [json_name = "to"];
}

message VoipUsageList {
  repeated VoipUsage items = 1 [json_name = "items"];
}

message VoipTopUpRequest {
  required uint64 voip_tenant_id = 1 [json_name = "voip_tenant_id"];
  // Amount in the parent account's currency.
  required double amount = 2 [json_name = "amount"];
}
