syntax = "proto2";
package raccoonai;

import "general.proto";
import "user.proto";

option go_package = "./pb";

message FcmTokenUpdate {
  required string fcm_token = 1 [json_name = "fcm_token"]; // empty unsubscribes
}

message UserRequest {
  required uint64 id = 1 [json_name = "id"];
  required uint64 owner_organization_id = 2 [json_name = "owner_organization_id"];
}

service UserService {
  rpc CreateUser(UserCreate) returns (User) {}
  rpc GetUser(UserRequest) returns (User) {}
  rpc UpdateUser(UserUpdate) returns (User) {}
  rpc ListUsers(UserListRequest) returns (UserList) {}
  rpc InviteUser(InviteUserRequest) returns (InviteUserResponse) {}
  rpc SetUserPassword(UserPasswordSet) returns (User) {}
  // Registers the caller's device for push. One token per user; a new token
  // replaces the old one. Drivers keep using DriverService.FirebaseNotifications.
  rpc UpdateFcmToken(FcmTokenUpdate) returns (MessageResponse) {}
}
