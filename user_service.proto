syntax = "proto2";
package raccoonai;

import "device.proto";
import "user.proto";

option go_package = "./pb";

message UserRequest {
  required uint64 id = 1 [json_name = "id"];
  required uint64 owner_organization_id = 2 [json_name = "owner_organization_id"];
}

service UserService {
  rpc CreateUser(UserCreate) returns (User) {}
  rpc GetUser(UserRequest) returns (User) {}
  rpc UpdateUser(UserUpdate) returns (User) {}
  rpc ListUsers(UserListRequest) returns (UserList) {}
  rpc InviteUser(InviteUserRequest) returns (InviteUserResponse) {}
  rpc SetUserPassword(UserPasswordSet) returns (User) {}
  // Generates a driver's tablet PIN, unique within the holding, and returns it once.
  rpc IssueDriverPin(DriverPinIssueRequest) returns (DriverPinIssueResponse) {}
}
