syntax = "proto2";
package raccoonai;

import "enums.proto";
import "file_upload.proto";
import "general.proto";
import "google/protobuf/timestamp.proto";
import "pickup_location.proto";

option go_package = "./pb";

message PickupLocationRequest {
  required uint64 id = 1 [json_name = "id"];
  required uint64 service_provider_id = 2 [json_name = "service_provider_id"];
}

message PickupLocationListRequest {
  repeated uint64 service_provider_ids = 1 [json_name = "service_provider_ids"];
  repeated uint64 service_receiver_ids = 2 [json_name = "service_receiver_ids"];
  // Only pickup locations hosting container groups bound to these pickup location groups.
  repeated uint64 pickup_location_group_ids = 3 [json_name = "pickup_location_group_ids"];
  // Only pickup locations hosting container groups whose group binding carries this job type.
  optional JobType job_type = 4 [json_name = "job_type"];
  // Only pickup locations hosting container groups of these container types.
  repeated uint64 container_type_ids = 5 [json_name = "container_type_ids"];
  // Only pickup locations hosting container groups whose contract prices a job
  // type of one of these categories (the container group's service schedule is
  // the fallback when the contract carries no tariff map).
  repeated JobCategory job_categories = 6 [json_name = "job_categories"];
  repeated LocationStatus statuses = 7 [json_name = "statuses"];
  optional string search = 8 [json_name = "search"];
  repeated PickupLocationType types = 9 [json_name = "types"];
  // No inheritance from the client's manager: a location with no manager_id matches nothing.
  repeated uint64 manager_ids = 11 [json_name = "manager_ids"];
  // facets: "status" (LocationStatus), "type" (PickupLocationType).
  optional ListFilter list_filter = 10 [json_name = "list_filter"];
}

message ContainerGroupJobLink {
  required uint64 container_group_id = 1 [json_name = "container_group_id"];
  required string job_type = 2 [json_name = "job_type"];
}

message BindContainerGroupsRequest {
  required uint64 pickup_location_group_id = 1 [json_name = "pickup_location_group_id"];
  repeated ContainerGroupJobLink links = 2 [json_name = "links"];
}

message RemoveContainerGroupRequest {
  required uint64 container_group_id = 1 [json_name = "container_group_id"];
  required uint64 pickup_location_group_id = 2 [json_name = "pickup_location_group_id"];
  required string job_type = 3 [json_name = "job_type"];
}

message ReorderContainerGroupsRequest {
  required uint64 pickup_location_group_id = 1 [json_name = "pickup_location_group_id"];
  // Container group ids in the desired display order (full list).
  repeated uint64 container_group_ids = 2 [json_name = "container_group_ids"];
}

message PickupLocationPhotosRequest {
  required uint64 pickup_location_id = 1 [json_name = "pickup_location_id"];
}

message PickupLocationPhoto {
  required FileUpload file_upload = 1 [json_name = "file_upload"];
  optional string driver_first_name = 2 [json_name = "driver_first_name"];
  optional string driver_last_name = 3 [json_name = "driver_last_name"];
}

message PickupLocationPhotoList {
  repeated PickupLocationPhoto photos = 1 [json_name = "photos"];
}

message PickupLocationListToContractRequest {
  repeated uint64 pickup_location_ids = 1 [json_name = "pickup_location_ids"];
  required uint64 contract_id = 2 [json_name = "contract_id"];
}

message PickupLocationGroupRequest {
  required uint64 id = 1 [json_name = "id"];
  required uint64 owner_organization_id = 2 [json_name = "owner_organization_id"];
}

message PickupLocationGroupListRequest {
  repeated uint64 owner_organization_ids = 1 [json_name = "owner_organization_ids"];
  // Only groups containing at least one container group owned by these organizations (service receivers).
  repeated uint64 service_receiver_ids = 2 [json_name = "service_receiver_ids"];
  // Only groups with a container group binding for this job type (combined with
  // service_receiver_ids: the same binding must satisfy both).
  optional JobType job_type = 3 [json_name = "job_type"];
  optional ListFilter list_filter = 10 [json_name = "list_filter"];
}

// What creating a job from one group link on a given day would do.
enum PickupLocationGroupLinkStatus {
  PICKUP_LOCATION_GROUP_LINK_STATUS_UNDEFINED = 0;
  // The schedule covers the day; tw_start_at/tw_end_at hold its window.
  PICKUP_LOCATION_GROUP_LINK_STATUS_SCHEDULED = 1;
  // The schedule exists but does not cover the day. Can still be created manually.
  PICKUP_LOCATION_GROUP_LINK_STATUS_NOT_SCHEDULED_ON_DAY = 2;
  // No schedule for this job type. Can still be created manually.
  PICKUP_LOCATION_GROUP_LINK_STATUS_NO_SCHEDULE = 3;
  // The contract does not allow this job; reason says why. Cannot be created.
  PICKUP_LOCATION_GROUP_LINK_STATUS_CONTRACT_ISSUE = 4;
  // A live unrouted job already exists for the day; use existing_job_id as a stop.
  PICKUP_LOCATION_GROUP_LINK_STATUS_JOB_EXISTS_UNROUTED = 5;
  // A live job already exists for the day and sits in existing_route_id.
  PICKUP_LOCATION_GROUP_LINK_STATUS_JOB_EXISTS_ROUTED = 6;
}

message PreviewPickupLocationGroupJobsRequest {
  required uint64 pickup_location_group_id = 1 [json_name = "pickup_location_group_id"];
  required google.protobuf.Timestamp date = 2 [json_name = "date"]; // service day, Asia/Almaty
  required uint64 owner_organization_id = 3 [json_name = "owner_organization_id"];
}

message PickupLocationGroupLinkPreview {
  required uint64 container_group_id = 1 [json_name = "container_group_id"];
  required string job_type = 2 [json_name = "job_type"]; // same form as ContainerGroupJobTypeLink.job_type
  required PickupLocationGroupLinkStatus status = 3 [json_name = "status"];
  // Schedule window for SCHEDULED, the existing job's window for JOB_EXISTS_*.
  optional google.protobuf.Timestamp tw_start_at = 4 [json_name = "tw_start_at"];
  optional google.protobuf.Timestamp tw_end_at = 5 [json_name = "tw_end_at"];
  // The day has several schedule windows; tw_* hold the first one.
  optional bool partial_window = 6 [json_name = "partial_window"];
  optional uint64 existing_job_id = 7 [json_name = "existing_job_id"];
  optional uint64 existing_route_id = 8 [json_name = "existing_route_id"];
  optional ErrorMessage reason = 9 [json_name = "reason"]; // set for CONTRACT_ISSUE
}

// One entry per group link, in step_idx order.
message PickupLocationGroupJobsPreview {
  repeated PickupLocationGroupLinkPreview links = 1 [json_name = "links"];
}

// Replace-set: omitted contracts are unbound. BY_NORM contracts only — the
// owner binding, pickup_location.contract_id, is not touched here.
message SetPickupLocationContractsRequest {
  required uint64 pickup_location_id = 1 [json_name = "pickup_location_id"];
  repeated uint64 contract_ids = 2 [json_name = "contract_ids"];
}

service PickupLocationService {
  // Pickup Location operations
  rpc CreatePickupLocation(PickupLocationCreate) returns (PickupLocation) {}
  rpc GetPickupLocationById(PickupLocationRequest) returns (PickupLocation) {}
  rpc UpdatePickupLocation(PickupLocationUpdate) returns (PickupLocation) {}
  rpc DeletePickupLocation(PickupLocationRequest) returns (MessageResponse) {}
  rpc ListPickupLocations(PickupLocationListRequest) returns (PickupLocationList) {}
  rpc ListPickupLocationPhotos(PickupLocationPhotosRequest) returns (PickupLocationPhotoList) {}
  rpc SetPickupLocationContracts(SetPickupLocationContractsRequest) returns (PickupLocation) {}
  // @todeprecate
  rpc BindPickupLocationListToContract(PickupLocationListToContractRequest) returns (MessageResponse) {}

  // Pickup Location Group operations
  rpc CreatePickupLocationGroup(PickupLocationGroupCreate) returns (PickupLocationGroup) {}
  rpc GetPickupLocationGroupById(PickupLocationGroupRequest) returns (PickupLocationGroup) {}
  rpc ListPickupLocationGroups(PickupLocationGroupListRequest) returns (PickupLocationGroupList) {}
  rpc UpdatePickupLocationGroup(PickupLocationGroupUpdate) returns (PickupLocationGroup) {}
  rpc DeletePickupLocationGroup(PickupLocationGroupRequest) returns (MessageResponse) {}
  rpc PreviewPickupLocationGroupJobs(PreviewPickupLocationGroupJobsRequest) returns (PickupLocationGroupJobsPreview) {}

  rpc BindContainerGroupsToPickupLocationGroup(BindContainerGroupsRequest) returns (MessageResponse) {}
  rpc UnbindContainerGroupFromPickupLocationGroup(RemoveContainerGroupRequest) returns (MessageResponse) {}
  rpc ReorderContainerGroupsInPickupLocationGroup(ReorderContainerGroupsRequest) returns (MessageResponse) {}
}
