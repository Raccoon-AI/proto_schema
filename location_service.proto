syntax = "proto2";
package raccoonai;

import "general.proto";
import "location.proto";

option go_package = "./pb";

service LocationService {
  rpc CreateLocation(LocationCreate) returns (Location) {}
  rpc ListLocations(LocationListRequest) returns (LocationList) {}
  rpc GetLocationById(LocationRequest) returns (Location) {}
  rpc UpdateLocation(LocationUpdate) returns (Location) {}
  rpc DeleteLocation(LocationRequest) returns (MessageResponse) {}
  // Lists all disposal sites, filter by organization settings
  rpc ListDisposalSites(ListDisposalSitesRequest) returns (LocationList) {}
  // Locations of the requested organizations and of the ones they selected in
  // their settings, which own the disposal sites they unload at.
  rpc ListDestinationLocations(LocationListRequest) returns (LocationList) {}
}
