syntax = "proto2";
package raccoonai;

import "analytics.proto";
import "enums.proto";
import "general.proto";
import "google/protobuf/timestamp.proto";

option go_package = "./pb";

// 1-3. Job time series — revenue / ordered / completed, unified behind one metric.
// JobMetric is defined in enums.proto.
message DailyValue {
  optional string date = 1 [json_name = "date"]; // YYYY-MM-DD
  optional uint64 value = 2 [json_name = "value"]; // revenue (whole tenge) or count, per metric
}

// GetJobMetricSeries request. location_id applies only to ORDERED, driver_id only to
// COMPLETED; both are ignored for REVENUE.
//
// owner_organization_id selects the organization the series is computed for; the caller must
// hold analytics view access on that organization (Permify decides, so admins can query the
// orgs they administer).
message JobMetricSeriesRequest {
  required uint64 owner_organization_id = 1 [json_name = "owner_organization_id"];
  optional DateFilter period = 2 [json_name = "period"];
  required JobMetric metric = 3 [json_name = "metric"];
  optional uint64 location_id = 4 [json_name = "location_id"];
  optional uint64 driver_id = 5 [json_name = "driver_id"];
  optional JobCategory job_category = 6 [json_name = "job_category"];
  optional uint64 service_receiver_id = 7 [json_name = "service_receiver_id"];
}

message JobMetricSeriesResponse {
  optional uint64 total = 1 [json_name = "total"];
  repeated DailyValue per_day = 2 [json_name = "per_day"];
}

// 6. service_provider_stats — point-in-time snapshot (reuses ServiceProviderStats).
message ServiceProviderStatsRequest {
  required uint64 owner_organization_id = 1 [json_name = "owner_organization_id"];
}

// 7. gas_levels — calibrated fuel-level series for a single truck, averaged into
//    interval_minutes-wide buckets. Backed by the ClickHouse `calibrated_gas_level_pm`
//    materialized view (per-minute calibrated readings from gps_raw_data).
// Tenancy is authorized against the truck's real owning organization, resolved server-side
// from truck_id, so a foreign truck id can never expose another tenant's telemetry.
// owner_organization_id is carried for consistency with the other analytics requests.
message GasLevelSeriesRequest {
  required uint64 owner_organization_id = 1 [json_name = "owner_organization_id"];
  required uint64 truck_id = 2 [json_name = "truck_id"];
  // Inclusive YYYY-MM-DD range, resolved to [from 00:00:00, to 23:59:59.999999999] UTC.
  required DateFilter period = 3 [json_name = "period"];
  // Bucket width in minutes. Defaults to 60 (hourly) when unset or 0.
  optional uint32 interval_minutes = 4 [json_name = "interval_minutes"];
}

message GasLevelPoint {
  // Start of the bucket.
  optional google.protobuf.Timestamp timestamp = 1 [json_name = "timestamp"];
  // Average calibrated fuel level over the bucket, in litres.
  optional double gas_level = 2 [json_name = "gas_level"];
}

message GasLevelSeriesResponse {
  optional uint64 truck_id = 1 [json_name = "truck_id"];
  repeated GasLevelPoint points = 2 [json_name = "points"];
}

message DriverActivitySeriesRequest {
  required uint64 owner_organization_id = 1 [json_name = "owner_organization_id"];
  optional DateFilter period = 2 [json_name = "period"];
  required DriverMetric metric = 3 [json_name = "metric"];
  optional uint64 driver_id = 4 [json_name = "driver_id"];
  optional RouteCategory route_category = 5 [json_name = "route_category"];
}

message DriverActivitySeriesResponse {
  optional uint64 total = 1 [json_name = "total"];
  repeated DailyValue per_day = 2 [json_name = "per_day"];
}

message RouteCategorySeriesRequest {
  required uint64 owner_organization_id = 1 [json_name = "owner_organization_id"];
  optional DateFilter period = 2 [json_name = "period"];
  optional uint64 driver_id = 3 [json_name = "driver_id"];
}

message RouteCategorySeries {
  optional RouteCategory route_category = 1 [json_name = "route_category"];
  optional uint64 total = 2 [json_name = "total"];
  repeated DailyValue per_day = 3 [json_name = "per_day"];
}

message RouteCategorySeriesResponse {
  repeated RouteCategorySeries series = 1 [json_name = "series"];
}

message FuelConsumptionSeriesRequest {
  required uint64 owner_organization_id = 1 [json_name = "owner_organization_id"];
  optional DateFilter period = 2 [json_name = "period"];
  optional uint64 driver_id = 3 [json_name = "driver_id"];
  optional uint64 truck_id = 4 [json_name = "truck_id"];
}

message DailyDoubleValue {
  optional string date = 1 [json_name = "date"];
  optional double value = 2 [json_name = "value"];
}

message FuelConsumptionSeriesResponse {
  optional double total_litres = 1 [json_name = "total_litres"];
  optional double avg_litres_per_100km = 2 [json_name = "avg_litres_per_100km"];
  repeated DailyDoubleValue per_day = 3 [json_name = "per_day"];
}

message EngineHoursSeriesRequest {
  required uint64 owner_organization_id = 1 [json_name = "owner_organization_id"];
  optional DateFilter period = 2 [json_name = "period"];
  optional uint64 driver_id = 3 [json_name = "driver_id"];
}

message EngineHoursSeriesResponse {
  optional uint64 total_seconds = 1 [json_name = "total_seconds"];
  optional uint64 avg_seconds_per_shift = 2 [json_name = "avg_seconds_per_shift"];
  repeated DailyValue per_day = 3 [json_name = "per_day"];
}

// Моточасы per driver shift, for the admin ТТН (waybill) page. One row per shift, over the
// same shift work window the engine-hours series uses, so both screens agree.
message ShiftEngineHoursRequest {
  required uint64 owner_organization_id = 1 [json_name = "owner_organization_id"];
  optional DateFilter period = 2 [json_name = "period"];
  optional uint64 driver_id = 3 [json_name = "driver_id"];
  optional uint64 truck_id = 4 [json_name = "truck_id"];
}

// window_start_at / window_end_at bound the span the figure was computed over, which is the
// shift's work window, not necessarily its full created-to-completed life.
message ShiftEngineHoursRow {
  optional uint64 driver_on_shift_id = 1 [json_name = "driver_on_shift_id"];
  optional uint64 truck_id = 2 [json_name = "truck_id"];
  optional uint64 driver_id = 3 [json_name = "driver_id"];
  optional google.protobuf.Timestamp window_start_at = 4 [json_name = "window_start_at"];
  optional google.protobuf.Timestamp window_end_at = 5 [json_name = "window_end_at"];
  optional uint64 window_seconds = 6 [json_name = "window_seconds"];
  // Unset when source is NONE -- absent telemetry is not zero engine time.
  optional uint64 engine_seconds = 7 [json_name = "engine_seconds"];
  optional EngineHoursSource source = 8 [json_name = "source"];
}

message ShiftEngineHoursResponse {
  repeated ShiftEngineHoursRow rows = 1 [json_name = "rows"];
}

// ---- Report rows for the admin's Analytics → Отчёты tabs: one flat row per entity with the
// ids and names a report shows. Joined names follow the <entity>_<field> pattern.

// Jobs of the provider organization itself (not its descendants), placeholder jobs excluded.
// time_filter.field picks the job's time column, tw_start_at by default.
message ReportJobsRequest {
  required uint64 owner_organization_id = 1 [json_name = "owner_organization_id"];
  required DateTimeFilter time_filter = 2 [json_name = "time_filter"];
  // Empty means every status.
  repeated JobStatus job_statuses = 3 [json_name = "job_statuses"];
  optional uint64 service_receiver_id = 4 [json_name = "service_receiver_id"];
  optional uint64 pickup_location_id = 5 [json_name = "pickup_location_id"];
  // The driver and truck of the job's shift.
  optional uint64 driver_id = 6 [json_name = "driver_id"];
  optional uint64 truck_id = 7 [json_name = "truck_id"];
}

message ReportJobRow {
  optional uint64 id = 1 [json_name = "id"];
  optional JobStatus status = 2 [json_name = "status"];
  optional google.protobuf.Timestamp tw_start_at = 3 [json_name = "tw_start_at"];
  optional google.protobuf.Timestamp fact_end_at = 4 [json_name = "fact_end_at"];
  optional google.protobuf.Timestamp created_at = 5 [json_name = "created_at"];
  optional google.protobuf.Timestamp updated_at = 6 [json_name = "updated_at"];
  optional uint64 service_receiver_id = 7 [json_name = "service_receiver_id"];
  optional string service_receiver_name = 8 [json_name = "service_receiver_name"];
  optional string service_receiver_bin = 9 [json_name = "service_receiver_bin"];
  optional uint64 pickup_location_id = 10 [json_name = "pickup_location_id"];
  optional string pickup_location_name = 11 [json_name = "pickup_location_name"];
  optional uint64 container_group_id = 12 [json_name = "container_group_id"];
  // The group's container type; legacy jobs without a group carry their own.
  optional uint64 container_type_id = 13 [json_name = "container_type_id"];
  optional string container_type_name = 14 [json_name = "container_type_name"];
  optional float container_type_volume = 15 [json_name = "container_type_volume"];
  // Unset for legacy jobs without a container group.
  optional uint32 number_of_containers = 16 [json_name = "number_of_containers"];
  optional string contract_deal_number = 17 [json_name = "contract_deal_number"];
  optional uint64 driver_id = 18 [json_name = "driver_id"];
  // "Surname Name".
  optional string driver_name = 19 [json_name = "driver_name"];
  optional uint64 truck_id = 20 [json_name = "truck_id"];
  optional string truck_plate_number = 21 [json_name = "truck_plate_number"];
  // Crew members of the shift with the loader role, "Surname Name", comma-separated.
  optional string loader_names = 22 [json_name = "loader_names"];
  // As the job list's has_photo_report filter reads it.
  optional bool has_photo_report = 23 [json_name = "has_photo_report"];
  optional string driver_comment = 24 [json_name = "driver_comment"];
  optional string service_provider_name = 25 [json_name = "service_provider_name"];
}

message ReportJobsResponse {
  repeated ReportJobRow rows = 1 [json_name = "rows"];
}

// Shifts of the organization and its descendants; time_filter.field defaults to tw_start_at.
message ReportDriverOnShiftsRequest {
  required uint64 owner_organization_id = 1 [json_name = "owner_organization_id"];
  required DateTimeFilter time_filter = 2 [json_name = "time_filter"];
}

message ReportDriverOnShiftRow {
  optional uint64 id = 1 [json_name = "id"];
  optional uint64 driver_id = 2 [json_name = "driver_id"];
  optional string driver_name = 3 [json_name = "driver_name"];
  optional uint64 truck_id = 4 [json_name = "truck_id"];
  optional string truck_plate_number = 5 [json_name = "truck_plate_number"];
  // The truck type's base type, else the truck's own deprecated type.
  optional TruckType truck_type = 6 [json_name = "truck_type"];
  optional google.protobuf.Timestamp tw_start_at = 7 [json_name = "tw_start_at"];
  optional google.protobuf.Timestamp started_at = 8 [json_name = "started_at"];
  optional google.protobuf.Timestamp completed_at = 9 [json_name = "completed_at"];
  optional google.protobuf.Timestamp created_at = 10 [json_name = "created_at"];
  optional google.protobuf.Timestamp departure_time = 11 [json_name = "departure_time"];
  optional google.protobuf.Timestamp arrival_time = 12 [json_name = "arrival_time"];
  repeated uint64 crew_ids = 13 [json_name = "crew_ids"];
  // Distinct categories of the shift's routes, UNDEFINED left out.
  repeated RouteCategory route_categories = 14 [json_name = "route_categories"];
  // A provider job on the shift reached COMPLETED (the driver app) in the time filter's
  // range, on fact_end_at; FORCE_COMPLETED does not count.
  optional bool has_app_completed_job = 15 [json_name = "has_app_completed_job"];
}

message ReportDriverOnShiftsResponse {
  repeated ReportDriverOnShiftRow rows = 1 [json_name = "rows"];
}

// Container groups at the pickup locations the organization and its descendants serve.
message ReportContainerGroupsRequest {
  required uint64 owner_organization_id = 1 [json_name = "owner_organization_id"];
}

// A pickup location group of the organization that links the container group for a job type.
message ReportPickupLocationGroup {
  optional string name = 1 [json_name = "name"];
  optional string job_type = 2 [json_name = "job_type"];
}

message ReportContainerGroupRow {
  optional uint64 id = 1 [json_name = "id"];
  optional uint64 pickup_location_id = 2 [json_name = "pickup_location_id"];
  optional string pickup_location_name = 3 [json_name = "pickup_location_name"];
  optional uint64 owner_organization_id = 4 [json_name = "owner_organization_id"];
  optional string owner_organization_name = 5 [json_name = "owner_organization_name"];
  optional uint64 container_type_id = 6 [json_name = "container_type_id"];
  optional string container_type_name = 7 [json_name = "container_type_name"];
  optional uint32 number_of_containers = 8 [json_name = "number_of_containers"];
  optional string contract_deal_number = 9 [json_name = "contract_deal_number"];
  optional google.protobuf.Timestamp contract_end_at = 10 [json_name = "contract_end_at"];
  // Job type → schedule expression; only string entries of the stored map.
  map<string, string> service_schedule_by_job_type = 11 [json_name = "service_schedule_by_job_type"];
  repeated ReportPickupLocationGroup pickup_location_groups = 12 [json_name = "pickup_location_groups"];
}

message ReportContainerGroupsResponse {
  repeated ReportContainerGroupRow rows = 1 [json_name = "rows"];
}

// Pickup locations the organization and its descendants serve, for the report filters.
message ReportPickupLocationsRequest {
  required uint64 owner_organization_id = 1 [json_name = "owner_organization_id"];
}

message ReportPickupLocation {
  optional uint64 id = 1 [json_name = "id"];
  optional string name = 2 [json_name = "name"];
}

message ReportPickupLocationsResponse {
  repeated ReportPickupLocation pickup_locations = 1 [json_name = "pickup_locations"];
}

service AnalyticsService {
  rpc GetJobMetricSeries(JobMetricSeriesRequest) returns (JobMetricSeriesResponse) {}
  rpc GetServiceProviderStats(ServiceProviderStatsRequest) returns (ServiceProviderStats) {}
  rpc GetGasLevelSeries(GasLevelSeriesRequest) returns (GasLevelSeriesResponse) {}
  rpc GetDriverActivitySeries(DriverActivitySeriesRequest) returns (DriverActivitySeriesResponse) {}
  rpc GetRouteCategorySeries(RouteCategorySeriesRequest) returns (RouteCategorySeriesResponse) {}
  rpc GetFuelConsumptionSeries(FuelConsumptionSeriesRequest) returns (FuelConsumptionSeriesResponse) {}
  rpc GetEngineHoursSeries(EngineHoursSeriesRequest) returns (EngineHoursSeriesResponse) {}
  rpc GetShiftEngineHours(ShiftEngineHoursRequest) returns (ShiftEngineHoursResponse) {}
  rpc GetReportJobs(ReportJobsRequest) returns (ReportJobsResponse) {}
  rpc GetReportDriverOnShifts(ReportDriverOnShiftsRequest) returns (ReportDriverOnShiftsResponse) {}
  rpc GetReportContainerGroups(ReportContainerGroupsRequest) returns (ReportContainerGroupsResponse) {}
  rpc GetReportPickupLocations(ReportPickupLocationsRequest) returns (ReportPickupLocationsResponse) {}
}
